
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מכירת ירקות ופירות - משנת יוסף</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/products.css">
</head>
<body>

    <header class="site-header">
        <a href="../index.html" class="logo-link">
            <img src="../assets/images/logo.png" alt="משנת יוסף" class="logo">
        </a>
    </header>

    <nav class="main-nav">
        <a href="../index.html">דף הבית</a>
        <a href="sales.html" class="active">מכירות פתוחות</a>
        <a href="pickup.html">הזמנות לאיסוף</a>
        <a href="register.html">הרשמה למערכת</a>
        <a href="about.html">אודות</a>
    </nav>

    <main class="home-main">
        <h1>מכירת ירקות ופירות</h1>
        <p>בחרו את הכמויות הרצויות למוצרים.</p>

        <form action="success.html" method="get">
            <section class="product-grid">

                <article class="product-card">
                    <img src="../assets/images/tomatoes.png"
                         alt="עגבניות" class="product-image">
                    <h2>עגבניות</h2>
                    <p>מחיר לק"ג: 5 ₪</p>
                    <label for="tomatoes">כמות בק"ג:</label>
                    <input id="tomatoes" name="tomatoes"
                           type="number" min="0" max="50" value="0">
                </article>

                <article class="product-card">
                    <img src="../assets/images/cucumbers.png"
                         alt="מלפפונים" class="product-image">
                    <h2>מלפפונים</h2>
                    <p>מחיר לק"ג: 6 ₪</p>
                    <label for="cucumbers">כמות בק"ג:</label>
                    <input id="cucumbers" name="cucumbers"
                           type="number" min="0" max="50" value="0">
                </article>

                <article class="product-card">
                    <img src="../assets/images/apples.png"
                         alt="תפוחים" class="product-image">
                    <h2>תפוחים</h2>
                    <p>מחיר לק"ג: 8 ₪</p>
                    <label for="apples">כמות בק"ג:</label>
                    <input id="apples" name="apples"
                           type="number" min="0" max="50" value="0">
                </article>

            </section>

            <button type="submit" class="main-button">
                 שליחת הזמנה
            </button>
            <button type="reset" class="reset-button">
                איפוס כמויות
            </button>
        </form>


    </main>

    <footer class="site-footer">
        <p>© כל הזכויות שמורות — פרויקט לימודי</p>
        <a href="about.html">אודות</a>
    </footer>

</body>
</html>
